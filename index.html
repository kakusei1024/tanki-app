<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>単語帳アプリ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#202020;color:white;min-height:100vh}
body.light{background:#eef3f8;color:#111}
.app{max-width:760px;margin:auto;min-height:100vh;padding:24px 24px 110px}
.screen{display:none}.screen.active{display:block}
.top{height:44px;display:flex;align-items:center;justify-content:space-between}
.icon{border:0;background:none;color:white;font-size:28px;cursor:pointer}
body.light .icon{color:#111}
.back{color:#ff5b7f}.hidden{visibility:hidden}
.title{font-size:22px;font-weight:900;text-align:center}
body.study-title-off #topTitle{visibility:hidden}
.card,.stat,.sliderBox,.stepBox{background:#2b2b2b;border-radius:28px;padding:28px;box-shadow:0 12px 35px rgba(0,0,0,.35)}
body.light .card,body.light .stat,body.light .sliderBox,body.light .stepBox{background:white;color:#111}
.center{min-height:calc(100vh - 180px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
button{height:54px;border:0;border-radius:16px;padding:0 18px;font-size:16px;font-weight:900;color:white;background:#697582;cursor:pointer}
button:active{transform:scale(.97)}
.blue{background:linear-gradient(90deg,#007bff,#26d0ff)}
.green{background:#697582}
.red{background:#dc2626}
.dark{background:#4b5563}
.big{width:100%;height:62px;border-radius:30px;margin-top:14px}
.homeCard{width:100%;max-width:600px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:600px;margin-top:18px}
.stat{padding:18px;text-align:left}.statNum{font-size:30px;font-weight:900}.statLabel{font-size:13px;opacity:.7}
.bookList{max-height:55vh;overflow:auto;margin-top:28px}
.bookItem{background:#dcefff;color:#111;border-radius:14px;padding:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;font-weight:900}
.bookItem.selected{outline:4px solid #38bdf8;background:#bdeaff}
.tools{display:flex;gap:14px}
.selectedMsg{text-align:center;margin-top:14px;color:#38bdf8;font-weight:900;min-height:24px}
.selectedMsgMini{background:#38bdf8;color:white;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:900;white-space:nowrap}
.bookArea{display:grid;grid-template-columns:110px 1fr;gap:18px;margin-top:30px}
.plus{width:96px;height:96px;border-radius:50%;font-size:46px;background:#007bff}
input,select,textarea{width:100%;height:50px;background:#1f1f1f;color:white;border:1px solid #555;border-radius:10px;padding:12px;font-size:16px}
body.light input,body.light select,body.light textarea{background:#f8fafc;color:#111}
textarea{height:50px;resize:none}
.label{font-size:13px;opacity:.75;margin:14px 0 6px}
.editor{max-width:620px;margin:26px auto}.wordRow{background:#242424;border-radius:16px;padding:14px;margin-top:14px}
body.light .wordRow{background:#f1f5f9}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.rangeRow{display:flex;align-items:center;justify-content:center;gap:24px;margin:30px 0}.rangeRow select{width:130px;height:56px;text-align:center;font-size:20px;font-weight:900}.wave{font-size:36px;font-weight:900}
.modeRow{display:flex;justify-content:center;gap:16px;margin-bottom:30px}.pill{min-width:105px;border-radius:24px}
.studyCard{text-align:center;min-height:260px;display:flex;flex-direction:column;justify-content:center}
.pageInfo{opacity:.7;margin-bottom:16px}
.wordLine{display:flex;justify-content:center;align-items:center;gap:10px}
.posBadge{min-width:24px;height:24px;border-radius:6px;background:#4b5563;color:white;display:none;align-items:center;justify-content:center;font-size:13px;font-weight:900;line-height:1;padding:0 6px;transform:translateY(4px)}
.word{font-size:56px;font-weight:900;word-break:break-word}
.answer{font-size:34px;font-weight:800;min-height:48px;margin-top:22px}
.modeSwitch{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin:12px 0}
.switch{position:relative;width:78px;height:38px}.switch input{display:none}.slider{position:absolute;inset:0;background:#555;border-radius:40px}.slider:before{content:"";position:absolute;width:30px;height:30px;left:4px;top:4px;background:white;border-radius:50%;transition:.2s}.switch input:checked+.slider{background:#7f8a99}.switch input:checked+.slider:before{transform:translateX(40px)}
.mainControl{display:flex;justify-content:center;margin:18px 0}.circle{width:96px;height:96px;border-radius:50%;font-size:20px}
.stepBox{text-align:center;border-radius:18px;padding:12px;margin:10px 0}.stepBox button{height:38px;padding:0 13px}.stepNum{font-size:24px;font-weight:900;margin:0 10px}
.moveRow{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
.sliders{display:none;grid-template-columns:1fr 1fr;gap:14px;margin-top:26px}.sliders.show{display:grid}.sliderBox{border-radius:18px;padding:14px}.sliderBox label{font-size:13px;opacity:.75}.sliderBox div{font-weight:900;margin:6px 0}.sliderBox input{height:auto}
.settingsBox{max-width:520px;width:100%}.future{margin-top:38px;opacity:.65}
.testChoices{display:grid;gap:14px;margin-top:28px}.choice{background:white;color:#111;border:3px solid #ddd;border-radius:14px;min-height:64px}.choice.correct{border-color:#38bdf8;background:#dbeafe}.choice.wrong{border-color:#dc2626;background:#fee2e2}
.bottomNav{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(560px,calc(100% - 28px));height:74px;background:#252525;border-radius:28px;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35)}
body.light .bottomNav{background:white;border:1px solid #ccc}
.nav{background:transparent;border-radius:0;font-size:21px;color:white;text-shadow:0 0 4px #000}
body.light .nav{color:#111;text-shadow:0 0 3px white}
.nav span{display:block;font-size:11px}.nav.active{background:linear-gradient(90deg,#007bff,#26d0ff);color:white}

/* 学習画面：左右操作パネル */
.studySideControls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin:12px 0 10px;
}
.sideStepBox{
  background:#2b2b2b;
  border-radius:18px;
  padding:12px;
  text-align:center;
  box-shadow:0 12px 35px rgba(0,0,0,.18);
}
body.light .sideStepBox{
  background:white;
  color:#111;
}
.sideStepBox button{
  height:38px;
  padding:0 13px;
}
.sideStepNum{
  font-size:24px;
  font-weight:900;
  margin:0 10px;
}
.sliders{
  margin-top:34px;
}

/* 単語編集：保存ボタンを下に固定 */
.editor{
  padding-bottom:110px;
}
.editActions{
  position:sticky;
  bottom:92px;
  z-index:20;
  background:#2b2b2b;
  padding:12px;
  border-radius:20px;
  box-shadow:0 -8px 25px rgba(0,0,0,.25);
}
body.light .editActions{
  background:white;
}


html{
  scrollbar-gutter:stable;
}
body{
  overflow-y:scroll;
}
#study{
  overflow-x:hidden;
}


/* 範囲・テスト画面の位置統一 */
.setupStartBtn{
  max-width:280px;
  margin-top:26px;
}

.testCountSelect{
  max-width:150px;
  height:48px;
  font-size:16px;
  font-weight:900;
  text-align:center;
}

.testCountBlock{
  margin-top:10px;
}

.testResultBox{
  max-width:680px;
  width:100%;
  margin:24px auto;
}

.resultItem{
  background:#2b2b2b;
  color:white;
  border-radius:16px;
  padding:14px;
  margin:12px 0;
  text-align:left;
}

body.light .resultItem{
  background:white;
  color:#111;
}

.resultItem.correct{
  border:3px solid #38bdf8;
}

.resultItem.wrong{
  border:3px solid #dc2626;
}

.resultMark{
  font-weight:900;
  margin-bottom:8px;
}

.resultLine{
  font-size:14px;
  margin:5px 0;
  opacity:.9;
}

.resultAnswer{
  font-weight:900;
}

.pageControlBtn:disabled{
  opacity:.35;
  cursor:not-allowed;
  transform:none;
}


/* 単語帳・テストの開始画面位置を完全統一 */
.setupBox{
  width:100%;
  max-width:360px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.setupTitle{
  margin-bottom:24px;
}

  display:flex;
  align-items:center;
  justify-content:center;
  gap:24px;

}

.setupRange select{
  width:100px;
  height:56px;
  text-align:center;
  font-size:20px;
  font-weight:900;
}

.setupModeRow{
  display:flex;
  justify-content:center;
  gap:16px;
  margin:0 0 28px;
}

.setupStartBtn{
  width:100%;
  max-width:280px;
  height:62px;
  border-radius:30px;
  margin-top:0;
}

.testCountBlock{
  margin-top:18px;

  flex-direction:column;
  align-items:center;
}

.testCountSelect{

/* v12: 単語帳・テスト開始画面を完全統一 */

/* 結果画面の重複項目削除後の見た目 */
.resultItem{
  line-height:1.55;
}


.recordList{
  width:100%;
  max-width:520px;
  margin-top:22px;
  display:grid;
  gap:12px;
}

.recordItem{
  background:#2b2b2b;

  border-radius:16px;
  padding:14px 16px;

}

body.light .recordItem{
  background:white;

}

.recordDate{
  font-size:15px;
}

.recordTime{
  font-size:18px;
  color:#38bdf8;
}

.emptyRecord{
  opacity:.65;
  margin-top:22px;
  font-weight:900;
}


/* v15: 単語帳タイプ・ */
.modePickRow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:12px 0 20px;width:100%;max-width:360px}
.modePickRow button{height:54px;border-radius:18px;font-weight:900}
.tagColorRow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 16px}
.tagColorBtn{width:34px;height:34px;border-radius:11px;border:3px solid transparent;padding:0;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.tagColorBtn.active{border-color:white;box-shadow:0 0 0 2px rgba(59,130,246,.9)}
body.light .tagColorBtn.active{border-color:#111}
.posBadge{background:var(--tag-color,#4b5563) !important}


/* v16: 登録画面の保存/サンプルは最下部固定、＋追加は追従しない */
#register .registerActions,
#edit .registerActions,
#register .stickyActions,
#edit .stickyActions,
#register .saveActions,
#edit .saveActions,
#register .bottomActions,
#edit .bottomActions{
  position:fixed !important;
  left:50% !important;
  transform:translateX(-50%) !important;
  right:auto !important;
  bottom:96px !important;
  width:calc(100% - 34px) !important;
  max-width:680px !important;
  display:grid !important;
  grid-template-columns:1fr 1fr !important;
  gap:14px !important;
  padding:14px !important;
  border-radius:24px !important;
  background:rgba(28,28,28,.88) !important;

  box-shadow:0 12px 36px rgba(0,0,0,.30) !important;
}

body.light #register .registerActions,

body.light #edit .stickyActions,

}

#edit .registerActions button,
#register .stickyActions button,
#edit .stickyActions button,
#register .saveActions button,
#edit .saveActions button,
#register .bottomActions button,
#edit .bottomActions button{

  height:64px !important;
  border-radius:22px !important;
}

/* ＋単語を追加は固定しない */
#register .addWordBtn,
#edit .addWordBtn,
#register button[onclick*="addWord"],
#edit button[onclick*="addWord"],
#register button[onclick*="addCard"],
#edit button[onclick*="addCard"]{

}

/* 固定保存ボタンに隠れないよう登録画面の下に余白 */
#register .center,
#edit .center{

}

/* v16: 自動ONは少しだけ濃い灰色 */
.switch input:checked + .slider{

}


/* v17: モード選択の青表示修正 */
.modePickRow button{
  background:#4b5563 !important;
  color:white !important;
  transition:.18s;
}
.modePickRow button.active{
  background:linear-gradient(90deg,#0b6cff,#39d2ff) !important;
  box-shadow:0 6px 18px rgba(0,140,255,.25);
}

/* v17: 単語帳選択の見切れ修正 */
.bookItem.selected,
.bookRow.selected,
.book.selected{
  box-sizing:border-box !important;
  width:100% !important;
  overflow:visible !important;
  padding-right:14px !important;
}

/* v17: 下タブの登録ボタンサイズ調整 */
.bottomNav .active,
.bottomNav .current,
.bottomNav .selected{

  padding:0 18px !important;
  margin:4px !important;

  align-items:center !important;
  justify-content:center !important;
  background:linear-gradient(90deg,#0b6cff,#39d2ff) !important;
}

/* v17: 編集/削除ボタンの間隔 */
.bookActions,
.actions{
  gap:18px !important;
}


/* v18: スマホ用に編集/削除ボタンを大きく離す */
.bookItem,
.bookRow,
.book{

  min-height:64px !important;

}

.bookActions,
.bookItem .actions,
.bookRow .actions,
.bookTools,
.bookButtons,

}

.bookActions button,
.bookItem .actions button,
.bookRow .actions button,
.bookTools button,
.bookButtons button,
.actions button{

/* 選択中でも右端が見切れないように */

.bookRow.selected,

/* タイトルがアイコンに被らないように */

  }

/* 編集ボタン */
.bookActions button:first-child,
.bookItem .actions button:first-child,
.bookRow .actions button:first-child,
.bookTools button:first-child,
.bookButtons button:first-child,

<script>


const SUBJECT_POS_MAP = {
  english:["選択しない","名詞","動詞","形容詞","副詞","熟語","句動詞"],
  kobun:["選択しない","動詞","形容詞","形容動詞","助動詞","敬語"],
  kanbun:["選択しない","句法","漢字","再読文字","重要語"],
  society:[]
};

const SUBJECT_LABEL_MAP = {
  english:"英語",
  kobun:"古文",
  kanbun:"漢文",
  society:"社会"
};

function getSubjectLabel(mode){
  return SUBJECT_LABEL_MAP[mode] || "英語";
}

function getPosOptionsByMode(mode){
  return SUBJECT_POS_MAP[mode] || [];
}

const APP_VERSION = "Vr_a7.0.1.4";

const DEFAULT_BOOKS=[{name:"新しい単語帳",mode:"english",cards:[{word:"apple",pos:"名詞",answer:"りんご"},{word:"book",pos:"名詞",answer:"本"}]}];

function safeJsonParse(value,fallback){
  try{
    if(value===null || value===undefined || value==="")return fallback;
    return JSON.parse(value);
  }catch(e){
    return fallback;
  }
}

function isValidBooksData(data){
  return Array.isArray(data) && data.length>0 && data.every(book=>{
    return book && typeof book==="object" && Array.isArray(book.cards);
  });
}

function cloneDefaultBooks(){
  return JSON.parse(JSON.stringify(DEFAULT_BOOKS));
}

function loadBooksSafely(){
  const main=safeJsonParse(localStorage.getItem("books"),null);
  if(isValidBooksData(main))return main;

  const latest=safeJsonParse(localStorage.getItem("books_backup_latest"),null);
  if(isValidBooksData(latest)){
    localStorage.setItem("books",JSON.stringify(latest));
    return latest;
  }

  const backup1=safeJsonParse(localStorage.getItem("books_backup_1"),null);
  if(isValidBooksData(backup1)){
    localStorage.setItem("books",JSON.stringify(backup1));
    return backup1;
  }

  const backup2=safeJsonParse(localStorage.getItem("books_backup_2"),null);
  if(isValidBooksData(backup2)){
    localStorage.setItem("books",JSON.stringify(backup2));
    return backup2;
  }

  const backup3=safeJsonParse(localStorage.getItem("books_backup_3"),null);
  if(isValidBooksData(backup3)){
    localStorage.setItem("books",JSON.stringify(backup3));
    return backup3;
  }

  return cloneDefaultBooks();
}

function saveBooksWithBackup(data){
  try{
    const next=JSON.stringify(data);
    const old=localStorage.getItem("books");

    if(old && old!==next){
      localStorage.setItem("books_backup_3",localStorage.getItem("books_backup_2")||old);
      localStorage.setItem("books_backup_2",localStorage.getItem("books_backup_1")||old);
      localStorage.setItem("books_backup_1",old);
    }

    localStorage.setItem("books",next);
    localStorage.setItem("books_backup_latest",next);
    localStorage.setItem("books_backup_time",new Date().toISOString());
  }catch(e){
    alert("保存に失敗しました。Safariの容量・プライベートブラウズ・サイトデータ設定を確認してください。");
    console.error(e);
  }
}



function openBackupSaveGuide(){
  const old=document.getElementById("backupSaveGuideModal");
  if(old)old.remove();

  const modal=document.createElement("div");
  modal.id="backupSaveGuideModal";
  modal.className="sampleMenuOverlay";
  modal.innerHTML=`
    <div class="sampleMenuBox">
      <h2>バックアップ保存</h2>
      <div style="text-align:left;line-height:1.7;font-size:14px;margin:14px 0 18px">
        <div style="font-weight:900;margin-bottom:8px">保存前に確認してください</div>
        <div>・このあとバックアップ用のJSONファイルを作成します。</div>

function restoreBackupFromFile(event){
  const file=event.target.files && event.target.files[0];
  if(!file)return;

  const reader=new FileReader();

  reader.onload=function(){
    try{
      const data=JSON.parse(reader.result);

      let nextBooks=null;
      let nextCurrentBook=0;
      let nextStudyRecords=null;

      if(Array.isArray(data)){
        nextBooks=data;
      }else if(data && Array.isArray(data.books)){
        nextBooks=data.books;
        nextCurrentBook=Number(data.currentBook||0);
        if(data.studyRecords && typeof data.studyRecords==="object"){
          nextStudyRecords=data.studyRecords;
        }
      }

      if(!isValidBooksData(nextBooks)){
        alert("このバックアップファイルは読み込めません");
        return;
      }

      if(!confirm("このバックアップから復元しますか？\n現在の単語帳データは置き換わります。")){
        return;
      }

      books=nextBooks;
      currentBook=Math.max(0,Math.min(nextCurrentBook,books.length-1));

      if(nextStudyRecords){
        studyRecords=nextStudyRecords;
        localStorage.setItem("studyRecords",JSON.stringify(studyRecords));
      }

      saveBooksWithBackup(books);
      localStorage.setItem("currentBook",currentBook);
      save();
      update();

      alert("バックアップから復元しました");
      go("home");
    }catch(e){
      alert("バックアップファイルの読み込みに失敗しました");
      console.error(e);
    }
  };

  reader.readAsText(file,"utf-8");
}

function tagShortByMode(pos,mode=currentBookMode()){
  pos=String(pos||"").trim();
  if(!pos)return "";
  const map=BOOK_MODES[mode]?.tagMap||BOOK_MODES.english.tagMap;
  if(map[pos])return map[pos];
  if(pos==="動"||pos==="動詞"||pos.toLowerCase()==="verb")return map["動詞"]||"動";
  if(pos==="自"||pos.includes("自動詞")||pos.toLowerCase()==="vi")return map["自動詞"]||"自";
  if(pos==="他"||pos.includes("他動詞")||pos.toLowerCase()==="vt")return map["他動詞"]||"他";
  if(pos==="名"||pos.includes("名詞")||pos.toLowerCase()==="noun")return map["名詞"]||"名";
  if(pos==="形"||pos.includes("形容詞")||pos.toLowerCase()==="adj")return map["形容詞"]||"形";
  if(pos==="副"||pos.includes("副詞")||pos.includes("副詞節")||pos.toLowerCase()==="adv")return map["副詞"]||"副";
  if(pos==="熟"||pos.includes("熟語"))return map["熟語"]||"熟";
  if(pos==="句"||pos.includes("句動詞"))return map["句動詞"]||"句";
  if(pos==="前"||pos.includes("前置詞"))return map["前置詞"]||"前";
  if(pos==="接"||pos.includes("接続詞"))return map["接続詞"]||"接";
  return pos.slice(0,1);
}

function todayKey(){
  const d=new Date();
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function syncTodayStudy(){
  const today=todayKey();

  if(today!==currentStudyDate){
    currentStudyDate=today;
    studySeconds=Number(studyRecords[currentStudyDate]||0);
  }

  if(!(currentStudyDate in studyRecords)){
    studyRecords[currentStudyDate]=studySeconds;
  }
}

function saveStudyRecords(){
  studyRecords[currentStudyDate]=studySeconds;
  localStorage.setItem("studyRecords",JSON.stringify(studyRecords));
  localStorage.setItem("studySeconds",studySeconds);
}


function addDaysKey(key,days){
  const parts=String(key).split("-").map(Number);
  const d=new Date(parts[0],parts[1]-1,parts[2]);
  d.setDate(d.getDate()+days);
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function dateKeyToTime(key){
  const parts=String(key).split("-").map(Number);
  return new Date(parts[0],parts[1]-1,parts[2]).getTime();
}

function getRecordDateRange(){
  const today=todayKey();
  let start=localStorage.getItem("studyStartDate")||today;

  const keys=Object.keys(studyRecords||{});
  if(keys.length){
    const oldest=keys.sort()[0];
    if(oldest && oldest<start)start=oldest;
  }

  return {start,today};
}

function formatDateLabel(key){
  const parts=String(key).split("-");
  if(parts.length!==3)return key;
  return `${Number(parts[1])}/${Number(parts[2])}`;
}

function renderStudyRecords(){
  const box=$("recordList");
  if(!box)return;

  syncTodayStudy();
  saveStudyRecords();

  const range=getRecordDateRange();
  const start=range.start;
  const today=range.today;

  box.innerHTML="";

  if(dateKeyToTime(start)>dateKeyToTime(today)){
    box.innerHTML='<div class="emptyRecord">まだ学習記録はありません</div>';
    return;
  }

  let current=today;
  const items=[];

  while(dateKeyToTime(current)>=dateKeyToTime(start)){
    const sec=Number(studyRecords[current]||0);
    items.push([current,sec]);
    current=addDaysKey(current,-1);
  }

  items.forEach(([date,sec])=>{
    const div=document.createElement("div");
    div.className="recordItem"+(Number(sec)===0?" zeroRecord":"");
    div.innerHTML=`
      <span class="recordDate">${formatDateLabel(date)}</span>
      <span class="recordTime">${format(sec)}</span>
    `;
    box.appendChild(div);
  });
}

  if(last && books[last.book] && books[last.book].cards && books[last.book].cards.length){
    currentBook=last.book;
    save();

    updateRange();

    const total=baseCards().length;
    const s=Math.max(1,Math.min(Number(last.start||1),total));
    const e=Math.max(1,Math.min(Number(last.end||total),total));

    $("startNum").value=s;
    $("endNum").value=e;

    qType=last.qType||"wm";
    setQ(qType);
    randomOrder=!!last.randomOrder;
    updateRandomButtonUI();

    let a=Math.min(s,e),b=Math.max(s,e);
    cards=baseCards().slice(a-1,b);
    if(randomOrder)cards=shuffleArray(cards);

    index=Math.max(0,Math.min(Number(last.index||0),cards.length-1));
    answerVisible=false;
    auto=false;
    $("autoSwitch").checked=false;

    stopStudy();
    studyReturnScreen="home";
    go("study");

    render();

  $("startNum").value=1;
  $("endNum").value=baseCards().length;
  startRange();

function startTest(){
  const rangeCards=getRangeCardsForTest();

  if(!rangeCards.length){
    alert("出題できる単語がありません");
    return;
  }

  let candidates=testCandidateCards();

  if(testNoPrev && candidates.length===0){
    openTestAllDoneModal();
    return;
  }

  if(!candidates.length){
    candidates=rangeCards;
  }

  rememberTestDesiredCount();
  let count=Number(testDesiredCount || $("testCount").value || 1);
  count=Math.min(Math.max(1,count),10,candidates.length);

  testCards=shuffleArray(candidates).slice(0,count);
  testIndex=0;
  testScore=0;
  testResults=[];

  /* VA: テスト開始時点で、前回なしON/OFF関係なく選択範囲の出題分を記憶 */
  const used=getUsedTestKeys();
  setUsedTestKeys([...used,...testCards.map(cardKey)]);

  go("testPlay");
  renderTest();
}


function renderTest(){
  if(!testCards.length)return;

  let q=testCards[testIndex];
  $("testInfo").textContent=`問題 ${testIndex+1} / ${testCards.length}`;
  $("testWord").textContent=testQuestionText(q);

  let choices=makeChoices(q);
  let box=$("testChoices");
  box.innerHTML="";

  choices.forEach(ch=>{
    let btn=document.createElement("button");
    btn.className="choice";
    btn.textContent=ch;

    btn.onclick=()=>{
      [...box.children].forEach(b=>b.disabled=true);

      const correctAnswer=testAnswerText(q);
      const isCorrect=ch===correctAnswer;

      testResults.push({
        question:testQuestionText(q),
        userAnswer:ch,
        correctAnswer:correctAnswer,
        word:q.word,
        answer:q.answer,
        correct:isCorrect
      });

      if(isCorrect){
        btn.classList.add("correct");
        testScore++;
      }else{
        btn.classList.add("wrong");
        [...box.children].forEach(b=>{
          if(b.textContent===correctAnswer)b.classList.add("correct");
        });
      }

      setTimeout(()=>{
        testIndex++;

        if(testIndex>=testCards.length){
          showTestResult();
        }else{
          renderTest();
        }
      },700);
    };

    box.appendChild(btn);
  });
}

function showTestResult(){
  $("testResultScore").textContent=`${testScore} / ${testCards.length} 正解`;

  let box=$("testResultList");
  box.innerHTML="";

  testResults.forEach((r,i)=>{
    let div=document.createElement("div");
    div.className="resultItem "+(r.correct?"correct":"wrong");

    div.innerHTML=`
      <div class="resultMark">${i+1}. ${r.correct?"○ 正解":"× 不正解"}</div>
      <div class="resultLine">問題：<span class="resultAnswer">${escapeHtml(r.question)}</span></div>
      <div class="resultLine">あなたの回答：<span class="resultAnswer">${escapeHtml(r.userAnswer)}</span></div>
      <div class="resultLine">正しい答え：<span class="resultAnswer">${escapeHtml(r.correctAnswer)}</span></div>
    `;

    box.appendChild(div);
  });

  go("testResult");
}

function makeChoices(q){
  const correctAnswer=testAnswerText(q);
  let answers=[...new Set(baseCards().map(c=>testAnswerText(c)).filter(a=>a&&a!==correctAnswer))];
  answers=shuffleArray(answers).slice(0,3);
  return shuffleArray([correctAnswer,...answers]);
}

function cardKeyForRandom(c){
  return String((c&&c.word)||"")+"|||"+String((c&&c.answer)||"");
}

function loadRandomMemory(){
  try{
    const data=JSON.parse(localStorage.getItem("randomMemoryV2")||"{}");
    return {
      firstKeys:Array.isArray(data.firstKeys)?data.firstKeys:[],
      overallKeys:Array.isArray(data.overallKeys)?data.overallKeys:[]
    };
  }catch(e){
    return {firstKeys:[],overallKeys:[]};
  }
}

function saveRandomMemory(firstKey,orderKeys){
  const memory=loadRandomMemory();

  if(firstKey){
    memory.firstKeys.unshift(firstKey);
    memory.firstKeys=[...new Set(memory.firstKeys)].slice(0,8);
  }

  (orderKeys||[]).forEach(k=>memory.overallKeys.unshift(k));
  memory.overallKeys=[...new Set(memory.overallKeys)].slice(0,20);

  localStorage.setItem("randomMemoryV2",JSON.stringify(memory));
}

function weightedPickIndex(pool,memory,position,resultKeys){
  const weights=pool.map(c=>{
    const key=cardKeyForRandom(c);
    let weight=1;

    const firstPos=memory.firstKeys.indexOf(key);
    if(position===0){
      if(firstPos===0)weight*=0.03;
      else if(firstPos===1)weight*=0.10;
      else if(firstPos===2)weight*=0.22;
      else if(firstPos>=3&&firstPos<6)weight*=0.45;
    }else{
      if(firstPos===0)weight*=0.35;
      else if(firstPos===1)weight*=0.55;
    }

    const overallPos=memory.overallKeys.indexOf(key);
    if(overallPos===0)weight*=0.25;
    else if(overallPos===1)weight*=0.35;
    else if(overallPos===2)weight*=0.50;
    else if(overallPos>=3&&overallPos<6)weight*=0.70;

    const justPickedPos=resultKeys.indexOf(key);
    if(justPickedPos===0)weight*=0.05;
    else if(justPickedPos===1)weight*=0.25;

    return Math.max(weight,0.01);
  });

  const total=weights.reduce((a,b)=>a+b,0);
  let r=Math.random()*total;

  for(let i=0;i<weights.length;i++){
    r-=weights[i];
    if(r<=0)return i;
  }

  return pool.length-1;
}

function shuffleArray(arr){
  let pool=[...arr];
  let result=[];
  let resultKeys=[];
  const memory=loadRandomMemory();

  while(pool.length){
    const pickIndex=weightedPickIndex(pool,memory,result.length,resultKeys);
    const picked=pool.splice(pickIndex,1)[0];
    const key=cardKeyForRandom(picked);

    result.push(picked);
    resultKeys.unshift(key);
  }

  saveRandomMemory(resultKeys[resultKeys.length-1],resultKeys.slice().reverse());
  return result;
}

  }catch(e){

  }
}

    all[testRangeKey()]=Array.from(new Set(list||[]));
    localStorage.setItem("usedTestKeysByRange",JSON.stringify(all));
  }catch(e){}
}

function clearUsedTestKeys(){
  try{

function getRangeCardsForTest(){
  const list=baseCards();
  if(!list.length)return [];

  const s=Number($("testStart")?.value||1);
  const e=Number($("testEnd")?.value||list.length);
  const a=Math.min(s,e);
  const b=Math.max(s,e);

  return list.slice(a-1,b);
}

function testCandidateCards(){
  const rangeCards=getRangeCardsForTest();

  if(!testNoPrev)return rangeCards;

  const used=new Set(getUsedTestKeys());
  const filtered=rangeCards.filter(c=>!used.has(cardKey(c)));

  return filtered;
}

    return;
  }

  try{
    if("caches" in window){
      caches.keys().then(keys=>{
        Promise.all(keys.map(key=>caches.delete(key))).finally(()=>{
          const base=location.origin + location.pathname;
          location.replace(base + "?refresh=" + Date.now());
        });
      }).catch(()=>{
        const base=location.origin + location.pathname;

function normalizeWordForDuplicateCheck(s){
  return String(s||"")
    .trim()
    .toLowerCase()
    .replace(/\s+/g," ");
}

function findDuplicateWordsInOtherBooks(newCards){
  const duplicates=[];
  const seenInNew=new Set();

  newCards.forEach(card=>{
    const key=normalizeWordForDuplicateCheck(card.word);
    if(!key || seenInNew.has(key))return;
    seenInNew.add(key);

    const hitBooks=[];

    books.forEach((book,bookIndex)=>{
      if(bookIndex===editBook)return;

      const found=(book.cards||[]).some(c=>{
        return normalizeWordForDuplicateCheck(c.word)===key;
      });

      if(found){
        hitBooks.push(book.name||"名前なし");
      }
    });

    if(hitBooks.length){
      duplicates.push({
        word:card.word,
        books:hitBooks
      });
    }
  });

  return duplicates;
}

function confirmDuplicateWordsBeforeSave(newCards){
  const duplicates=findDuplicateWordsInOtherBooks(newCards);

  if(!duplicates.length)return true;

  const lines=duplicates.slice(0,8).map(d=>{
    return `・${d.word}：${d.books.join(" / ")}`;
  }).join("\n");

  const more=duplicates.length>8 ? `\n他 ${duplicates.length-8} 件` : "";

  return confirm(
    "他の単語帳と重複している単語があります。\n\n"+
    lines+
    more+
    "\n\nそれでも登録しますか？"
  );
}

      dot.classList.toggle("active", String(dot.dataset.color||"").toLowerCase()===String(color||"").toLowerCase());
    });
  });
}

function saveBook(){
  books[editBook].name=$("bookName").value||"新しい単語帳";
  if($("editBookMode"))books[editBook].mode=$("editBookMode").value||"english";

  let rows=[...document.querySelectorAll(".wordRow")];

  const nextCards=rows.map(r=>({
    word:r.querySelector(".w").value.trim(),
    pos:normalizeNonePosValue(r.querySelector(".p") ? r.querySelector(".p").value : ""),
    answer:r.querySelector(".a").value.trim(),
    tagColor:r.dataset.tagColor||"#4b5563",
    answerColor:getRowMeaningColor(r)||""
  })).filter(c=>c.word&&c.answer);

  if(!confirmDuplicateWordsBeforeSave(nextCards)){
    return;
  }

  books[editBook].cards=nextCards;

  save();
  go("register");
}

function applyStudyDisplayFixes(){
  try{
    if(currentScreen!=="study" || !cards || !cards.length || !cards[index])return;
    const c=cards[index];
    const pos=normalizeNonePosValue(c.pos);
    const badge=$("posBadge");
    if(badge){
      const ps=posShort(pos);
      badge.textContent=ps;
      badge.style.display=ps ? "inline-flex" : "none";
      if(ps)badge.style.setProperty("background", c.tagColor || "#4b5563", "important");
    }

    const wordEl=$("word");
    const answerEl=$("answer");
    if(wordEl)wordEl.style.color="";
    if(answerEl)answerEl.style.color="";

    const meaningColor=c.answerColor || "";
    // 単→意：答えとして表示される意味に色を反映
    if(qType==="wm"){
      if(answerEl)answerEl.style.color=meaningColor;
    }else{
      // 意→単：問題として表示される意味に色を反映
      if(wordEl)wordEl.style.color=meaningColor;
    }
  }catch(e){}
}

if(typeof render==="function" && !window.__meaningColorRenderPatched){
  window.__meaningColorRenderPatched=true;
  const __oldRender=render;
  render=function(){
    __oldRender();
    applyStudyDisplayFixes();
  };
}

setInterval(()=>{
  if(document.getElementById("edit")?.classList.contains("active")){
    syncMeaningColorButtonColors();
  }
  if(document.getElementById("study")?.classList.contains("active")){
    applyStudyDisplayFixes();
  }
},200);

<script id="va71-enhancement-script">
(function(){
  "use strict";

  function byId(id){return document.getElementById(id)}
  function esc(s){return String(s??"").replace(/[&<>\"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}



  function splitQuickSingle(value){
    let text=String(value||'').normalize('NFKC').trim();
    if(!text)return null;

    const isJa=ch=>/[\u3040-\u30ff\u3400-\u9fff々〆ヶ]/.test(ch);
    const isEn=ch=>/[A-Za-z]/.test(ch);
    const chars=[...text];
    const firstJa=chars.findIndex(isJa);
    const firstEn=chars.findIndex(isEn);
    if(firstJa<0 || firstEn<0)return null;

    let word='', answer='';
    if(firstEn<firstJa){
      word=chars.slice(0,firstJa).join('');
      answer=chars.slice(firstJa).join('');
    }else{
      answer=chars.slice(0,firstEn).join('');
      word=chars.slice(firstEn).join('');
    }

    const trimBoundary=s=>s
      .replace(/^[\s|｜:：=＝,，、/／→]+/,'')
      .replace(/[\s|｜:：=＝,，、/／→]+$/,'')
      .trim();
    word=trimBoundary(word);
    answer=trimBoundary(answer);
    if(!word || !answer || !/[A-Za-z]/.test(word) || !/[\u3040-\u30ff\u3400-\u9fff々〆ヶ]/.test(answer))return null;
    return {word,answer};
  }

  function paintQuickDetection(){
    const input=byId('vaQuickInput'), status=byId('vaQuickStatus');
    if(!input||!status)return;
    const text=input.value.trim();
    status.className='vaQuickStatus';
    if(!text){
      status.textContent='例：Appleりんご　→　単語「Apple」 / 意味「りんご」';
      return;
    }
    const pair=splitQuickSingle(text);
    if(pair){
      status.classList.add('ok');
      status.innerHTML='✓ <span class="vaQuickPreview">'+esc(pair.word)+'</span> → <span class="vaQuickPreview">'+esc(pair.answer)+'</span>';
    }else{
      status.classList.add('warn');
      status.textContent='英語と日本語を続けて入力してください（例：Appleりんご）';
    }
  }

  function commitQuickEntry(){
    const input=byId('vaQuickInput'), status=byId('vaQuickStatus');
    if(!input)return;
    const pair=splitQuickSingle(input.value);
    if(!pair){paintQuickDetection();input.focus();return;}

    // 通常登録と同じ重複チェックを、簡単登録でも追加前に通す
    if(typeof window.confirmDuplicateWordsBeforeSave==='function'){
      const ok=window.confirmDuplicateWordsBeforeSave([{word:pair.word,answer:pair.answer}]);
      if(!ok){
        if(status){
          status.className='vaQuickStatus warn';
          status.textContent='重複登録をキャンセルしました';
        }
        input.focus();
        return;
      }
    }

    // 同じ編集中の単語帳内ですでに入力済みの単語も確認
    const normalized=typeof window.normalizeWordForDuplicateCheck==='function'
      ? window.normalizeWordForDuplicateCheck(pair.word)
      : String(pair.word||'').trim().toLowerCase().replace(/\s+/g,' ');
    const sameBookDuplicate=[...document.querySelectorAll('#rows .wordRow .w')].some(el=>{
      const value=typeof window.normalizeWordForDuplicateCheck==='function'
        ? window.normalizeWordForDuplicateCheck(el.value)
        : String(el.value||'').trim().toLowerCase().replace(/\s+/g,' ');
      return normalized && value===normalized;
    });
    if(sameBookDuplicate){
      const ok=window.confirm('この単語帳内に同じ単語があります。\n\n・'+pair.word+'\n\nそれでも登録しますか？');
      if(!ok){
        if(status){
          status.className='vaQuickStatus warn';
          status.textContent='重複登録をキャンセルしました';
        }
        input.focus();
        return;
      }
    }

    let rows=[...document.querySelectorAll('#rows .wordRow')];
    let target=rows.find(r=>{
      const w=r.querySelector('.w'), a=r.querySelector('.a');
      return w && a && !w.value.trim() && !a.value.trim();
    });
    if(!target){
      if(typeof window.addRow==='function')window.addRow();
      rows=[...document.querySelectorAll('#rows .wordRow')];
      target=rows[rows.length-1];
    }
    if(!target)return;

    const w=target.querySelector('.w'), a=target.querySelector('.a');
    if(w){w.value=pair.word;w.dispatchEvent(new Event('input',{bubbles:true}));}
    if(a){a.value=pair.answer;a.dispatchEvent(new Event('input',{bubbles:true}));}
    target.classList.remove('vaQuickFlash');
    void target.offsetWidth;
    target.classList.add('vaQuickFlash');

    input.value='';
    if(status){
      status.className='vaQuickStatus ok';
      status.textContent='✓ 追加しました。続けて入力できます';
    }
    setTimeout(()=>{if(status && !input.value)paintQuickDetection();},900);
    input.focus();
  }

  function updateQuickEntryVisibility(){
    const panel=byId('vaQuickEntry');
    if(!panel)return;
    const mode=byId('editBookMode')?.value || 'english';
    panel.style.display=mode==='english'?'':'none';
  }

  function ensureQuickEntry(){
    const rows=byId('rows');
    if(!rows||byId('vaQuickEntry'))return;
    const panel=document.createElement('div');
    panel.id='vaQuickEntry';
    panel.className='vaQuickEntry';
    panel.innerHTML=`
      <div class="vaQuickTitle">かんたん登録</div>
      <div class="vaQuickSub">英語と日本語を1つの欄に続けて入力するだけです。順番はどちらでもOK。</div>
      <div class="vaQuickOneRow">
        <input id="vaQuickInput" class="vaQuickInput" autocomplete="off" autocapitalize="none" enterkeyhint="done" placeholder="Appleりんご">
        <button id="vaQuickAdd" type="button" class="blue vaQuickAdd">追加</button>
      </div>
      <div id="vaQuickStatus" class="vaQuickStatus">例：Appleりんご　→　単語「Apple」 / 意味「りんご」</div>`;
    rows.insertAdjacentElement('beforebegin',panel);

    const input=byId('vaQuickInput');
    input?.addEventListener('input',paintQuickDetection);
    input?.addEventListener('keydown',e=>{
      if(e.key==='Enter'){
        e.preventDefault();
        commitQuickEntry();
      }
    });
    byId('vaQuickAdd')?.addEventListener('click',commitQuickEntry);
    byId('editBookMode')?.addEventListener('change',updateQuickEntryVisibility);
    updateQuickEntryVisibility();
  }

  function ensureSearch(sectionId,listId,placeholder){
    const section=byId(sectionId), list=byId(listId);
    if(!section||!list||section.querySelector('.vaBookSearchWrap'))return;
    const wrap=document.createElement('div');
    wrap.className='vaBookSearchWrap';
    wrap.innerHTML='<input class="vaBookSearch" type="search" autocomplete="off" inputmode="search" placeholder="'+esc(placeholder)+'" aria-label="'+esc(placeholder)+'"><span class="vaBookSearchIcon">⌕</span>';
    section.insertBefore(wrap,list);
    const empty=document.createElement('div');
    empty.className='vaBookEmpty';
    empty.textContent='該当する単語帳がありません';
    list.insertAdjacentElement('afterend',empty);
    wrap.querySelector('input').addEventListener('input',()=>filterList(listId));
  }

  function filterList(listId){
    const list=byId(listId); if(!list)return;
    const section=list.closest('.screen');
    const input=section?.querySelector('.vaBookSearch');
    const q=(input?.value||'').trim().toLowerCase();
    let visible=0;
    list.querySelectorAll('.bookItem').forEach(item=>{
      const ok=!q || item.textContent.toLowerCase().includes(q);
      item.style.display=ok?'':'none';
      if(ok)visible++;
    });
    const empty=section?.querySelector('.vaBookEmpty');
    if(empty)empty.style.display=visible===0?'block':'none';
  }

  function enhanceBookLists(){
    [['pickBookList',true],['bookList',false]].forEach(([id])=>{
      const list=byId(id); if(!list)return;
      [...list.querySelectorAll('.bookItem')].forEach((item,i)=>{
        const b=(window.books||[])[i];
        const block=item.querySelector('.bookTitleBlock');
        if(block && !block.querySelector('.bookMetaMini')){
          const meta=document.createElement('div');
          meta.className='bookMetaMini';
          const count=Array.isArray(b?.cards)?b.cards.length:0;
          meta.textContent=count+'語';
          block.appendChild(meta);
        }
      });
      filterList(id);
    });
  }

  function ensureProgress(){
    const card=document.querySelector('#study .studyCard');
    const info=byId('pageInfo');
    if(!card||!info)return;
    if(!byId('vaProgressTrack')){
      const track=document.createElement('div');
      track.id='vaProgressTrack'; track.className='vaProgressTrack';
      track.innerHTML='<div id="vaProgressBar" class="vaProgressBar"></div>';
      info.insertAdjacentElement('afterend',track);
    }
    if(!byId('vaStudyHint')){
      const hint=document.createElement('div');
      hint.id='vaStudyHint'; hint.className='vaStudyHint';
      hint.textContent='タップ：答え / 次へ　・　左右スワイプ：移動　・　PC：Space / ← →';
      card.insertAdjacentElement('afterend',hint);
    }
  }

  function updateProgress(){
    ensureProgress();
    const bar=byId('vaProgressBar');
    if(!bar)return;
    const total=Array.isArray(window.cards)?window.cards.length:0;
    const idx=Number(window.index||0);
    bar.style.width=total?Math.min(100,((idx+1)/total)*100)+'%':'0%';
  }

  function bindStudyGestures(){
    const card=document.querySelector('#study .studyCard');
    if(!card||card.dataset.vaGestureBound)return;
    card.dataset.vaGestureBound='1';
    let sx=0,sy=0,st=0,moved=false;
    card.addEventListener('pointerdown',e=>{
      if(e.button!==undefined && e.button!==0)return;
      sx=e.clientX; sy=e.clientY; st=Date.now(); moved=false;
      card.classList.add('vaTouching');
    });
    card.addEventListener('pointermove',e=>{
      if(Math.abs(e.clientX-sx)>8 || Math.abs(e.clientY-sy)>8)moved=true;
    });
    card.addEventListener('pointerup',e=>{
      card.classList.remove('vaTouching');
      if(!byId('study')?.classList.contains('active'))return;
      const dx=e.clientX-sx, dy=e.clientY-sy;
      if(Math.abs(dx)>55 && Math.abs(dx)>Math.abs(dy)*1.25){
        if(dx<0 && typeof window.next==='function')window.next();
        else if(dx>0 && typeof window.prev==='function')window.prev();
        return;
      }
      if(!moved && Date.now()-st<500 && typeof window.mainAction==='function')window.mainAction();
    });
    card.addEventListener('pointercancel',()=>card.classList.remove('vaTouching'));
  }

  function bindKeyboard(){
    if(window.__va71KeyboardBound)return; window.__va71KeyboardBound=true;
    document.addEventListener('keydown',e=>{
      const tag=(e.target?.tagName||'').toLowerCase();
      if(['input','textarea','select'].includes(tag))return;
      if(byId('study')?.classList.contains('active')){
        if(e.key===' ' || e.key==='Enter'){
          e.preventDefault(); if(typeof window.mainAction==='function')window.mainAction();
        }else if(e.key==='ArrowRight'){
          e.preventDefault(); if(typeof window.next==='function')window.next();
        }else if(e.key==='ArrowLeft'){
          e.preventDefault(); if(typeof window.prev==='function')window.prev();
        }
      }else if(byId('testPlay')?.classList.contains('active') && /^[1-4]$/.test(e.key)){
        const btns=[...document.querySelectorAll('#testChoices .choice:not(:disabled)')];
        const btn=btns[Number(e.key)-1]; if(btn)btn.click();
      }
    });
  }

  function openGuide(){
    if(byId('vaGuideOverlay'))return;
    const overlay=document.createElement('div');
    overlay.id='vaGuideOverlay'; overlay.className='vaGuideOverlay';
    overlay.innerHTML=`<div class="vaGuideBox" role="dialog" aria-modal="true" aria-label="操作ガイド">
      <h2>操作ガイド</h2>
      <p><b>スマホ学習：</b>カードをタップで「答え → 次へ」。左右スワイプで前後移動できます。</p>
      <p><b>PC学習：</b><kbd>Space</kbd> / <kbd>Enter</kbd>で答え・次へ、<kbd>←</kbd><kbd>→</kbd>で移動。</p>
      <p><b>テスト：</b>PCでは<kbd>1</kbd>〜<kbd>4</kbd>で選択肢を選べます。</p>
      <p><b>単語帳一覧：</b>上の検索欄でタイトル・科目を絞り込めます。各単語帳には登録語数も表示されます。</p>
      <button class="big blue vaGuideClose">閉じる</button>
    </div>`;
    document.body.appendChild(overlay);
    overlay.addEventListener('click',e=>{if(e.target===overlay || e.target.classList.contains('vaGuideClose'))overlay.remove()});
  }

  function ensureGuideButton(){
    const box=document.querySelector('#settings .settingsBox'); if(!box||byId('vaGuideBtn'))return;
    const anchor=[...box.querySelectorAll('button')].find(b=>b.textContent.includes('学習記録'));
    const btn=document.createElement('button');
    btn.id='vaGuideBtn'; btn.className='big dark'; btn.textContent='操作ガイド';
    btn.addEventListener('click',openGuide);
    if(anchor)anchor.insertAdjacentElement('afterend',btn); else box.appendChild(btn);
  }

  function updateVersion(){
    const v=byId('homeVersionText'); if(v)v.textContent='Vr_a7.1.4';
    const notice=byId('noticeContent');
    if(notice && !notice.textContent.includes('Vr_a7.1.3')){
      const item=notice.querySelector('.noticeItem')||notice;
      item.insertAdjacentHTML('afterbegin','<div>・Vr_a7.1.3 簡単登録でも通常登録と同じ重複警告を表示</div><div>・Vr_a7.1.2 1欄入力だけで英語/日本語を自動分割する簡単登録に変更</div><div>・Vr_a7.1.1 英語/日本語の自動振り分け登録を追加</div>');
    }
  }

  function init(){
    ensureQuickEntry();
    ensureSearch('pickBook','pickBookList','単語帳を検索');
    ensureSearch('register','bookList','単語帳を検索');
    ensureProgress();
    bindStudyGestures();
    bindKeyboard();
    ensureGuideButton();
    updateVersion();
    enhanceBookLists();
    updateProgress();

    if(typeof window.updateBookLists==='function' && !window.__va71BookListPatched){
      window.__va71BookListPatched=true;
      const old=window.updateBookLists;
      window.updateBookLists=function(){ const r=old.apply(this,arguments); enhanceBookLists(); return r; };
    }
    if(typeof window.render==='function' && !window.__va71RenderPatched){
      window.__va71RenderPatched=true;
      const old=window.render;
      window.render=function(){ const r=old.apply(this,arguments); updateProgress(); return r; };
    }
  }

  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});
  else init();
})();
</script>


<script>
/* VA7.1.4: 意味本文 / 末尾の括弧補足 / 明示改行を区別して表示 */
(function(){
  function splitMeaningForDisplay(raw){
    const text=String(raw ?? '').replace(/\r\n?/g,'\n').trim();
    if(!text)return [];

    const result=[];
    const explicitLines=text.split(/\n+/).map(s=>s.trim()).filter(Boolean);

    explicitLines.forEach(line=>{
      // 「；」「;」は意味の区切りとして別段落扱い。普通の読点「、」では分けない。
      const semanticParts=line.split(/\s*[；;]\s*/).map(s=>s.trim()).filter(Boolean);
      semanticParts.forEach(part=>{
        let main=part;
        const notes=[];
        // 文末の (補足) / （補足） / [補足] / ［補足］ / 【補足】 を本文から分離。
        // 直前の「、」「,」も補足との区切りなら本文末から取り除く。
        const noteRe=/(?:\s*[、,，]\s*)?((?:\([^()\n]{1,160}\)|（[^（）\n]{1,160}）|\[[^\[\]\n]{1,160}\]|［[^［］\n]{1,160}］|【[^【】\n]{1,160}】))\s*$/;
        let safety=0;
        while(safety++<4){
          const m=main.match(noteRe);
          if(!m)break;
          notes.unshift(m[1].trim());
          main=main.slice(0,m.index).trim();
        }
        if(main)result.push({type:'main',text:main});
        notes.forEach(note=>result.push({type:'note',text:note}));
        if(!main && !notes.length)result.push({type:'main',text:part});
      });
    });
    return result;
  }

  function renderStructuredMeaning(el,text){
    if(!el)return;
    const parts=splitMeaningForDisplay(text);
    el.replaceChildren();
    parts.forEach(p=>{
      const node=document.createElement('div');
      node.className=p.type==='note'?'meaningNote':'meaningParagraph';
      node.textContent=p.text;
      el.appendChild(node);
    });
  }

  function applyMeaningStructure(){
    try{
      if(typeof currentScreen!=='undefined' && currentScreen!=='study')return;
      if(typeof cards==='undefined' || !cards || !cards.length || !cards[index])return;
      const c=cards[index];
      const meaning=String(c.answer ?? '');
      const wordEl=document.getElementById('word');
      const answerEl=document.getElementById('answer');

      // 単→意なら意味は下のanswer、意→単なら意味は上のword。
      if(typeof qType!=='undefined' && qType==='wm'){
        if(typeof answerVisible!=='undefined' && answerVisible)renderStructuredMeaning(answerEl,meaning);
      }else{
        renderStructuredMeaning(wordEl,meaning);
      }
    }catch(e){}
  }

  window.__applyMeaningStructure=applyMeaningStructure;

  if(typeof window.render==='function' && !window.__va714MeaningRenderPatched){
    window.__va714MeaningRenderPatched=true;
    const old=window.render;
    window.render=function(){
      const r=old.apply(this,arguments);
      applyMeaningStructure();
      return r;
    };
  }

  function bumpVersion(){
    const v=document.getElementById('homeVersionText');
    if(v)v.textContent='Vr_a7.1.4';
    const notice=document.getElementById('noticeContent');
    if(notice && !notice.textContent.includes('Vr_a7.1.4')){
      const item=notice.querySelector('.noticeItem')||notice;
      item.insertAdjacentHTML('afterbegin','<div>・Vr_a7.1.4 学習画面で意味本文と末尾の括弧補足を自動で別段落表示。入力した改行も保持</div>');
    }
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',()=>{bumpVersion();applyMeaningStructure();},{once:true});
  }else{
    bumpVersion();
    applyMeaningStructure();
  }
})();
</script>

<script id="va718-tts-script">
(function(){
  'use strict';
  const TTS_KEY='va_tts_auto';
  let autoRead=localStorage.getItem(TTS_KEY)==='1';
  let lastAutoToken='';
  let speakingTimer=null;
  let voiceCache=[];
  let voiceWaitPromise=null;
  let speakSerial=0;

  function isEnglishBook(){
    try{ return typeof currentBookMode==='function' ? currentBookMode()==='english' : true; }catch(e){ return true; }
  }

  function englishIsVisible(){
    try{
      if(typeof qType==='undefined')return false;
      return qType==='wm' || (qType==='mw' && !!answerVisible);
    }catch(e){return false;}
  }

  function getCurrentEnglish(){
    try{
      if(typeof cards==='undefined' || !cards || !cards.length || !cards[index])return '';
      return String(cards[index].word||'').trim();
    }catch(e){return '';}
  }

  function refreshVoices(){
    try{
      const v=window.speechSynthesis?.getVoices?.()||[];
      if(v.length)voiceCache=v.slice();
    }catch(e){}
    return voiceCache;
  }

  function voiceScore(v){
    const lang=String(v.lang||'').toLowerCase();
    const name=String(v.name||'').toLowerCase();
    let score=0;
    if(lang==='en-us')score+=120;
    else if(lang.startsWith('en-us'))score+=115;
    else if(lang==='en-gb')score+=85;
    else if(lang.startsWith('en'))score+=60;
    if(v.localService)score+=8;
    if(v.default)score+=4;

    // 表示名/URIに品質情報がある場合は、Enhanced / Premium / Neural / Natural 系を最優先。
    const descriptor=(name+' '+String(v.voiceURI||'').toLowerCase());
    if(/enhanced|premium|neural|natural|high quality|hq/.test(descriptor))score+=160;

    // iPhone / macOS / Chrome / Edge で比較的自然に聞こえやすい英語音声を内部で優先。
    const preferred=[
      ['ava',95],['samantha',92],['allison',82],['susan',78],['zoe',76],
      ['nathan',76],['tom',72],['daniel',68],['google us english',90],
      ['microsoft aria',92],['microsoft jenny',88],['microsoft guy',78]
    ];
    for(const [needle,pts] of preferred){ if(descriptor.includes(needle)){score+=pts;break;} }

    // Compact / 旧式 / 効果音系は学習用途ではかなり聞き取りにくいので強く避ける。
    if(/compact|eloquence|novelty|whisper|bells|organ|bad news|good news|zarvox|trinoids|cellos|boing|bubbles/.test(descriptor))score-=320;
    return score;
  }

  function pickEnglishVoice(){
    const voices=refreshVoices();
    const english=voices.filter(v=>/^en(?:-|$)/i.test(String(v.lang||'')));
    if(!english.length)return null;
    return english.slice().sort((a,b)=>voiceScore(b)-voiceScore(a))[0]||null;
  }

  function ensureVoices(){
    if(refreshVoices().length)return Promise.resolve(voiceCache);
    if(voiceWaitPromise)return voiceWaitPromise;
    voiceWaitPromise=new Promise(resolve=>{
      let done=false;
      const finish=()=>{
        if(done)return;
        done=true;
        try{window.speechSynthesis?.removeEventListener?.('voiceschanged',onChange);}catch(e){}
        refreshVoices();
        voiceWaitPromise=null;
        resolve(voiceCache);
      };
      const onChange=()=>finish();
      try{window.speechSynthesis?.addEventListener?.('voiceschanged',onChange,{once:true});}catch(e){}
      setTimeout(finish,450);
    });
    return voiceWaitPromise;
  }

  function setSpeakingUI(on){
    const b=document.getElementById('ttsSpeakBtn');
    if(b)b.classList.toggle('speaking',!!on);
    clearTimeout(speakingTimer);
    if(on) speakingTimer=setTimeout(()=>{ if(b)b.classList.remove('speaking'); },3500);
  }

  function isAppleMobile(){
    try{
      return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
    }catch(e){return false;}
  }

  function speakText(text, fromUserGesture=false){
    text=String(text||'').trim();
    if(!text)return;
    if(!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance==='undefined'){
      alert('このブラウザでは読み上げ機能を利用できません。');
      return;
    }

    const synth=window.speechSynthesis;
    const mySerial=++speakSerial;

    const startSpeak=()=>{
      if(mySerial!==speakSerial)return;
      try{
        // Chrome / Edge で speechSynthesis が paused のまま残ることがあるため毎回復帰させる。
        synth.resume();
        // 単語だけを裸で渡すと、一部の端末で語尾の音素が弱く潰れることがある。
        // 読み上げ用だけ軽い継続ポーズを付け、最後の音まで発音させる。画面表示は変更しない。
        const speechText=/[.!?。！？,…，]$/.test(text) ? text : (text + ',');
        const u=new SpeechSynthesisUtterance(speechText);
        // voice は強制せず、端末・ブラウザ標準の英語音声を使用。
        u.lang='en-US';
        // 単語学習では少しだけ遅くして、語尾の子音・弱母音まで潰れにくくする。
        u.rate=0.91;
        u.pitch=1.0;
        u.volume=1.0;
        u.onstart=()=>setSpeakingUI(true);
        u.onend=()=>{
          // 発話終了直後にUIや次の音声処理を切り替えず、短い余韻を残す。
          setTimeout(()=>setSpeakingUI(false),260);
        };
        u.onerror=(ev)=>{
          setSpeakingUI(false);
          // 手動タップ時だけ、PC側で再生拒否された場合に原因が分かるよう通知。
          if(fromUserGesture && ev && (ev.error==='not-allowed' || ev.error==='audio-busy')){
            console.warn('TTS playback blocked:',ev.error);
          }
        };
        synth.speak(u);
        // Chromium系で稀に pause 状態へ戻るケースの保険。
        setTimeout(()=>{try{ if(synth.paused)synth.resume(); }catch(e){}},60);
      }catch(e){
        setSpeakingUI(false);
        console.warn('TTS error',e);
      }
    };

    try{
      synth.cancel();
      synth.resume();
      refreshVoices();

      // PCではユーザー操作中に同期的に speak() して再生ブロックを避ける。
      // iPhone/iPadは従来どおり cancel() 直後の音切れ回避のため短い待ちを残す。
      if(isAppleMobile()) setTimeout(startSpeak,75);
      else startSpeak();
    }catch(e){
      setSpeakingUI(false);
      console.warn('TTS prepare error',e);
    }
  }

  function speakCurrent(fromUserGesture=false){
    if(!isEnglishBook() || !englishIsVisible())return;
    speakText(getCurrentEnglish(),fromUserGesture);
  }

  function updateTTSUI(){
    const speak=document.getElementById('ttsSpeakBtn');
    const bar=document.getElementById('ttsAutoBar');
    const autoBtn=document.getElementById('ttsAutoBtn');
    const active=(typeof currentScreen==='undefined' || currentScreen==='study') && isEnglishBook();
    const canSpeak=active && englishIsVisible() && !!getCurrentEnglish();
    if(speak)speak.classList.toggle('show',canSpeak);
    if(bar)bar.classList.toggle('show',active);
    if(autoBtn){
      autoBtn.classList.toggle('active',autoRead);
      autoBtn.textContent=autoRead?'🔊 自動読み上げ ON':'🔊 自動読み上げ OFF';
    }
  }

  function maybeAutoSpeak(){
    updateTTSUI();
    if(!autoRead || !isEnglishBook() || !englishIsVisible())return;
    const text=getCurrentEnglish();
    if(!text)return;
    const phase=(typeof qType!=='undefined' && qType==='mw') ? Number(!!answerVisible) : 1;
    const token=[typeof index!=='undefined'?index:-1, typeof qType!=='undefined'?qType:'', phase, text].join('|');
    if(token===lastAutoToken)return;
    lastAutoToken=token;
    setTimeout(()=>{
      if(autoRead && isEnglishBook() && englishIsVisible() && getCurrentEnglish()===text)speakText(text);
    },110);
  }

  function toggleAutoRead(e){
    if(e){e.preventDefault();e.stopPropagation();}
    autoRead=!autoRead;
    localStorage.setItem(TTS_KEY,autoRead?'1':'0');
    lastAutoToken='';
    updateTTSUI();
    if(autoRead)speakCurrent(true);
    else if('speechSynthesis' in window){ speakSerial++; window.speechSynthesis.cancel(); }
  }

  function installUI(){
    const card=document.querySelector('#study .studyCard');
    if(card && !document.getElementById('ttsSpeakBtn')){
      const b=document.createElement('button');
      b.id='ttsSpeakBtn';
      b.className='ttsSpeakBtn';
      b.type='button';
      b.setAttribute('aria-label','英単語を読み上げ');
      b.title='英単語を読み上げ';
      b.textContent='🔊';
      b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();speakCurrent(true);});
      card.appendChild(b);
    }
    const mode=document.querySelector('#study .modeSwitch');
    if(mode && !document.getElementById('ttsAutoBar')){
      const bar=document.createElement('div');
      bar.id='ttsAutoBar';
      bar.className='ttsAutoBar';
      const b=document.createElement('button');
      b.id='ttsAutoBtn';
      b.className='ttsAutoBtn';
      b.type='button';
      b.addEventListener('click',toggleAutoRead);
      bar.appendChild(b);
      mode.insertAdjacentElement('afterend',bar);
    }
    updateTTSUI();
  }

  function patchRender(){
    if(typeof window.render==='function' && !window.__va716TtsRenderPatched){
      window.__va716TtsRenderPatched=true;
      const old=window.render;
      window.render=function(){
        const r=old.apply(this,arguments);
        maybeAutoSpeak();
        return r;
      };
    }
  }

  function bumpVersion(){
    const v=document.getElementById('homeVersionText');
    if(v)v.textContent='Vr_a7.1.6';
    const notice=document.getElementById('noticeContent');
    if(notice && !notice.textContent.includes('Vr_a7.1.6')){
      const item=notice.querySelector('.noticeItem')||notice;
      item.insertAdjacentHTML('afterbegin','<div>・Vr_a7.1.6 読み上げ音声を高品質寄りに自動最適化。学習画面の意味を単語と同じ文字色に統一</div>');
    }
  }

  function init(){
    refreshVoices();
    try{window.speechSynthesis?.addEventListener?.('voiceschanged',refreshVoices);}catch(e){}
    installUI();
    patchRender();
    bumpVersion();
    updateTTSUI();
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});
  else init();

  window.vaSpeakCurrentWord=speakCurrent;
})();
</script>
